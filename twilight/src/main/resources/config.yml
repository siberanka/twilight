# Twilight never replaces vanilla Bedrock assets unless this is explicitly enabled.
vanilla-override: false

generation:
  strict: true
  # Startup and supported provider reload events trigger a debounced conversion.
  auto-build-on-startup: true
  sync-provider-changes: true
  startup-delay-ticks: 40
  # Wait for provider reload/pack commands to finish writing their outputs.
  provider-command-delay-ticks: 100
  maximum-source-bytes: 1073741824
  maximum-archive-entries: 100000
  # Hash-verified Mojang client/asset caches resolve explicit vanilla dependencies.
  download-vanilla-assets: true

sources:
  auto-discover: true
  additional: []

geyser:
  directory: auto
  deploy-after-build: true
  reload-after-deploy: true
  backups-to-keep: 3

ui:
  # Desktop chest screens use Java's container layout: the title is unwrapped,
  # Java-aligned, uses Java's 0x404040 text colour and is drawn above slot
  # frames but below items; the player inventory keeps Java's distance from the
  # chest grid. Font-image menus therefore line up with their slots. This is
  # merged into Bedrock's chest UI instead of replacing it.
  java-container-layout: true
  # Container titles are laid out for Bedrock players with Java font metrics:
  # space/negative-space characters, bitmap glyph bearings and font characters
  # that Java remaps are reproduced with invisible spacer glyphs and private-use
  # aliases, so menu images land on Java's exact pixels. Requires Geyser.
  java-text-layout: true
